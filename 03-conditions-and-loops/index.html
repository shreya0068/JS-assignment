<!DOCTYPE html>
<html>
<head>
    <title>Conditions and Loops</title>
</head>
<body>
    <h2>JavaScript Conditions and Loops</h2>
    <script>
        // Conditional Statement
        let marks = 75;

        if (marks >= 40) {
            console.log("Result: Pass");
        } else {
            console.log("Result: Fail");
        }
        // For Loop
        console.log("For Loop:");

        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }
        // While Loop
        console.log("While Loop:");
        let j = 1;
        while (j <= 3) {
            console.log(j);
            j++;
        }
    </script>
</body>
</html>
