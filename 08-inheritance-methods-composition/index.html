<!DOCTYPE html>
<html>
<head>
    <title>Inheritance, Methods and Composition</title>
</head>
<body>

    <h2>JavaScript Inheritance and Methods</h2>

    <script>
        // Parent Class
        class Person {
            constructor(name) {
                this.name = name;
            }

            greet() {
                return "Hello, " + this.name;
            }
        }

        // Child Class
        class Student extends Person {
            constructor(name, course) {
                super(name);
                this.course = course;
            }

            showCourse() {
                return this.course;
            }
        }

        // Creating an object
        let student = new Student("Rahul", "JavaScript");

        console.log(student.greet());
        console.log("Course:", student.showCourse());
    </script>

</body>
</html>
