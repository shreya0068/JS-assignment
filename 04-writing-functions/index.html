<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>
<body>

    <h2>JavaScript Functions Example</h2>

    <script>
        // Function to add two numbers
        function add(a, b) {
            return a + b;
        }

        // Function to display a greeting
        function greet(name) {
            return "Hello, " + name + "!";
        }

        let result = add(10, 20);

        console.log("Sum:", result);
        console.log(greet("Student"));
    </script>

</body>
</html>
