<!DOCTYPE html>
<html>
<head>
    <title>Callbacks and Higher-Order Functions</title>
</head>
<body>

    <h2>JavaScript Callbacks Example</h2>
    <script>
        // Callback function
        function add(a, b) {
            return a + b;
        }
        // Higher-order function
        function calculate(a, b, operation) {
            return operation(a, b);
        }
        // Passing add as a callback
        let result = calculate(10, 20, add);
        console.log("Addition Result:", result);
        // Another callback function
        function multiply(a, b) {
            return a * b;
        }
        let product = calculate(10, 20, multiply);

        console.log("Multiplication Result:", product);
    </script>

</body>
</html>
