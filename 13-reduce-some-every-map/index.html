<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Array Methods</title>
</head>
<body>

    <h2>Reduce, Some, Every and Map</h2>

    <script>
        let numbers = [2, 4, 6, 8, 10];

        // Using map()
        let doubled = numbers.map(num => num * 2);
        console.log("Doubled Array:", doubled);

        // Using reduce()
        let sum = numbers.reduce((total, num) => total + num, 0);
        console.log("Sum:", sum);

        // Using some()
        let hasLargeNumber = numbers.some(num => num > 8);
        console.log("Any number greater than 8:", hasLargeNumber);

        // Using every()
        let allPositive = numbers.every(num => num > 0);
        console.log("All numbers positive:", allPositive);
    </script>

</body>
</html>
